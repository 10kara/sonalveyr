name: Deploy archive

on:
  push:
    branches: [main]
    paths-ignore: ['api/**', 'gar-archives/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          # Settings → Secrets and variables → Actions → Variables:
          #   API_URL       = https://api.solanveyr.com
          #   CUSTOM_DOMAIN = solanveyr.com   (если сайт открывается по своему домену)
          VITE_API_URL: ${{ vars.API_URL || secrets.API_URL }}
          # Путь берётся из имени репозитория: переименование не ломает сайт.
          VITE_BASE: ${{ vars.CUSTOM_DOMAIN && '/' || format('/{0}/', github.event.repository.name) }}

      # У GitHub Pages нет SPA-фолбэка: 404.html = index.html,
      # чтобы прямые ссылки вида /dossier открывались.
      - name: SPA fallback and custom domain
        run: |
          cp dist/index.html dist/404.html
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
