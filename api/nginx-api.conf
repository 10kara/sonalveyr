# /etc/nginx/sites-available/api.solanveyr.com
# После копирования: ln -s /etc/nginx/sites-available/api.solanveyr.com /etc/nginx/sites-enabled/
#                    nginx -t && systemctl reload nginx
#                    certbot --nginx -d api.solanveyr.com
server {
    listen 80;
    server_name api.solanveyr.com;

    client_max_body_size 10m;

    # Картинки отдаёт сам nginx — быстрее, чем через Node.
    location /uploads/ {
        alias /opt/solanveyr-api/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Cross-Origin-Resource-Policy cross-origin;
        types { image/jpeg jpg jpeg; image/png png; image/gif gif; image/webp webp; }
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_types application/json;
}
